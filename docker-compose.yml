x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      ConnectionStrings__Stanley: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Discord__Token: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      Discord__TestGuildIds: ${DISCORD_TEST_GUILD_IDS:-}
      Discord__HomeGuildId: ${DISCORD_HOME_GUILD_ID:-}
      Discord__WikiEditorRoleId: ${DISCORD_WIKI_EDITOR_ROLE_ID:-}
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft: Warning
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
          pids: 256

volumes:
  postgres-data:
